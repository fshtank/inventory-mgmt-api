spring:
  application:
    name: inventory-api
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyThatShouldBeChangedInProductionMustBeLongEnough}
  expiration: 86400000

server:
  port: 8080
